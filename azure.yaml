# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: zava-scrum-agent
infra:
  provider: bicep
  path: infra
  module: main
services:
  api:
    project: ./src/Zava.Scrum.Api
    host: containerapp
    language: dotnet
    docker:
      path: ../../Dockerfile.api
      context: ../..
      remoteBuild: true
  bridge:
    project: ./src/meeting-bridge
    host: containerapp
    language: ts
    docker:
      path: ../../Dockerfile.bridge
      context: ../..
      remoteBuild: true
# Everything Bicep cannot express is scripted here and is idempotent (docs/DEPLOY.md, ADR 0015a).
hooks:
  predown:
    - shell: pwsh
      run: ./infra/hooks/foundry-cleanup.ps1
      interactive: false
      continueOnError: false
  preprovision:
    - shell: pwsh
      run: ./infra/hooks/preflight.ps1
      interactive: false
      continueOnError: false
    - shell: pwsh
      run: ./infra/hooks/entra-portal-app.ps1
      interactive: false
      continueOnError: false
  postprovision:
    - shell: pwsh
      run: ./infra/hooks/registry-rbac.ps1
      interactive: false
      continueOnError: false
    - shell: pwsh
      run: ./infra/hooks/entra-post.ps1
      interactive: false
      continueOnError: false
    - shell: pwsh
      run: ./infra/hooks/ado-setup.ps1
      interactive: false
      continueOnError: false
    - shell: pwsh
      run: ./infra/hooks/exchange.ps1 -Mode Apply
      interactive: false
      continueOnError: false
  postdeploy:
    - shell: pwsh
      run: ./infra/hooks/agent-host.ps1
      interactive: false
      continueOnError: false
    - shell: pwsh
      run: ./infra/hooks/agent-identity.ps1
      interactive: false
      continueOnError: false
    - shell: pwsh
      run: ./infra/hooks/media-host.ps1
      interactive: false
      continueOnError: false
    - shell: pwsh
      run: ./infra/hooks/public-pages.ps1
      interactive: false
      continueOnError: false
    - shell: pwsh
      run: ./infra/hooks/teams-app.ps1
      interactive: false
      continueOnError: false