name: decision-evaluation

on:
  pull_request:
    paths: ['demo/evaluation/**', 'tools/GateRunner/**', 'src/**/Voice/**', 'src/**/Agents/**']
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Rules baseline
        run: dotnet run --project tools/GateRunner -c Release -- --evaluate demo/evaluation/decision-goldens.json --out evaluation/rules
      - name: Existing evaluation identity
        if: ${{ vars.EVALUATION_PROJECT_ENDPOINT != '' && vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Real decision model and release policy
        if: ${{ vars.EVALUATION_PROJECT_ENDPOINT != '' && vars.AZURE_CLIENT_ID != '' }}
        env:
          AZURE_TOKEN_CREDENTIALS: AzureCliCredential
          EVALUATION_PROJECT_ENDPOINT: ${{ vars.EVALUATION_PROJECT_ENDPOINT }}
          EVALUATION_DECISION_DEPLOYMENT: ${{ vars.EVALUATION_DECISION_DEPLOYMENT }}
        run: dotnet run --project tools/GateRunner -c Release --no-build -- --evaluate demo/evaluation/decision-goldens.json --model --release-check --out evaluation/model
      - name: Publish measured report, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-evaluation
          path: evaluation/
      - name: Job summary
        if: always()
        shell: bash
        run: |
          cat evaluation/rules/decision-evaluation.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f evaluation/model/decision-evaluation.md ]; then
            cat evaluation/model/decision-evaluation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Real model: not_run. Configure the existing OIDC identity and EVALUATION_PROJECT_ENDPOINT; rules are not model evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
